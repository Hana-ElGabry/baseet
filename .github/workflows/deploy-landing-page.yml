name: Deploy Baseet frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SW/frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        working-directory: SW/frontend
        run: npm ci

      - name: Build frontend
        working-directory: SW/frontend
        env:
          REACT_APP_API_URL: https://YOUR-BACKEND-DOMAIN.example.com
          REACT_APP_WS_URL: wss://YOUR-BACKEND-DOMAIN.example.com
        run: npm run build

      - name: Support React Router refreshes
        run: cp SW/frontend/build/index.html SW/frontend/build/404.html

      - name: Add custom domain
        run: echo "baseet.tech" > SW/frontend/build/CNAME

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: SW/frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
